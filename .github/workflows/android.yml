name: Android

on:
  pull_request:
    paths: ['AndroidApp/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['AndroidApp/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AndroidApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests, lint and debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: basalt-debug-apk
          path: AndroidApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
