# Builds the desktop app and runs the fast test tiers on every pull request.
#
# The UI tiers take over a real desktop and the Stripe tiers need secrets, so
# neither runs here; run them locally before merging anything that touches
# the app's behaviour. The job is named `test` because branch protection on
# `main` requires a passing check with that name.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install server dependencies
        working-directory: Server
        run: npm ci --no-fund --no-audit

      - name: Install test dependencies
        run: python -m pip install -r automation/requirements.txt

      - name: Build desktop app
        working-directory: DesktopApp
        run: dotnet build -c Release -nologo

      # The release ships a Windows on ARM build too (tools/build_release.ps1).
      # The runner is x64, so this only proves it publishes and that the exe
      # really is ARM64; running it needs an ARM machine.
      - name: Publish Windows on ARM build
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'publish-arm64'
          dotnet publish DesktopApp/FlowShield.csproj -c Release -r win-arm64 --self-contained true -o $out --nologo -v minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # PE header: e_lfanew at 0x3C, then "PE\0\0", then the machine type.
          $bytes = [IO.File]::ReadAllBytes((Join-Path $out 'FlowShield.exe'))
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0xAA64) { Write-Error ('FlowShield.exe is machine 0x{0:X4}, not ARM64 (0xAA64)' -f $machine); exit 1 }
          Write-Host 'FlowShield.exe is ARM64'

      - name: Fast tests (no UI, no Stripe)
        run: python -m pytest automation/tests -m "not ui and not stripe" -q -p no:cacheprovider --color=yes

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            logs/
            reports/
          if-no-files-found: ignore
