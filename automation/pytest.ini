[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --color=yes
markers =
    stripe: needs Stripe test credentials in .stripe_keys.json
    ui: drives the desktop app through UI Automation (slow)
    e2e: full end-to-end path
